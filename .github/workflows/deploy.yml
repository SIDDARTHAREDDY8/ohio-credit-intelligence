name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Debug credential shape (no secret values exposed)
        env:
          AKID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SAK: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "access key id length (expect 20): ${#AKID}"
          echo "secret access key length (expect 40): ${#SAK}"
          echo "access key id prefix (expect AKIA/ASIA): ${AKID:0:4}"
          # Detect leading/trailing whitespace without printing the secret
          printf '%s' "$AKID" | grep -qE '^[A-Z0-9]{20}$' && echo "key id charset OK" || echo "key id has unexpected chars/whitespace"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t ohio-credit-api -f api/Dockerfile .
          docker tag ohio-credit-api:latest $ECR_REGISTRY/ohio-credit-api:latest
          docker tag ohio-credit-api:latest $ECR_REGISTRY/ohio-credit-api:${{ github.sha }}
          docker push $ECR_REGISTRY/ohio-credit-api:latest
          docker push $ECR_REGISTRY/ohio-credit-api:${{ github.sha }}

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t ohio-credit-frontend -f frontend/Dockerfile .
          docker tag ohio-credit-frontend:latest $ECR_REGISTRY/ohio-credit-frontend:latest
          docker push $ECR_REGISTRY/ohio-credit-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ohio-credit-intelligence
            git pull origin main
            aws ecr get-login-password --region us-east-2 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Deployed successfully at $(date)"
