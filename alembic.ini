# Alembic configuration for the Ohio Credit Intelligence Platform.
# The database URL is resolved at runtime from the DATABASE_URL environment
# variable in migrations/env.py, so it is intentionally left blank here.

[alembic]
script_location = migrations
prepend_sys_path = .
# Use OS path separators and a date-prefixed slug for new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
